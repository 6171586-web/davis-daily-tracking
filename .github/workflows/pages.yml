name: Deploy Davis daily tracking

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "0 3-15 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check whether today's update is complete
        if: github.event_name == 'schedule'
        id: update-gate
        run: |
          if node scripts/should-update.mjs; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare automatic update
        if: github.event_name != 'push' && (github.event_name != 'schedule' || steps.update-gate.outputs.run == 'true')
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install update service
        if: github.event_name != 'push' && (github.event_name != 'schedule' || steps.update-gate.outputs.run == 'true')
        run: npm ci
      - name: Read mailbox and refresh market data
        if: github.event_name != 'push' && (github.event_name != 'schedule' || steps.update-gate.outputs.run == 'true')
        run: npm run update
        env:
          QQ_EMAIL: ${{ secrets.QQ_EMAIL }}
          QQ_AUTH_CODE: ${{ secrets.QQ_AUTH_CODE }}
      - name: Save refreshed data
        if: github.event_name != 'push' && (github.event_name != 'schedule' || steps.update-gate.outputs.run == 'true')
        run: |
          if git diff --quiet -- data/state.json site/data.js; then
            echo "No new published data"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json site/data.js
          git commit -m "Update daily performance data"
          git push
      - name: Configure Pages
        if: github.event_name != 'schedule' || steps.update-gate.outputs.run == 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        if: github.event_name != 'schedule' || steps.update-gate.outputs.run == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy
        if: github.event_name != 'schedule' || steps.update-gate.outputs.run == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
